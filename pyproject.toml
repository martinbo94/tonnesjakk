[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "tonnesjakk"
version = "0.1.0"
description = "Tønnesjakk game engine with AI"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "onnx>=1.14",
    "onnxscript>=0.1",
    "onnxruntime>=1.15",
]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "tonnesjakk._core"
