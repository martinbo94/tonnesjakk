[package]
name = "tonnesjakk_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "tonnesjakk_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module is enabled by maturin (pyproject.toml features), NOT here —
# hardcoding it makes `cargo test` unlinkable (no Python symbols at test link time).
pyo3 = { version = "0.24" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wide = "0.7"  # Portable SIMD
memmap2 = "0.9"  # Tablebase files: shared read-only pages across worker processes
# ONNX runtime: ONLY the AlphaZero research module (mcts) needs it. Optional so
# the tablebase-solver build on Linux (vm_solve.sh: --no-default-features)
# never links onnxruntime (undefined OrtGetApiBase at import otherwise).
ort = { version = "2.0.0-rc.11", features = ["coreml"], optional = true }

[features]
default = ["mcts"]
mcts = ["dep:ort"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Enable native CPU features for auto-vectorization (AVX2, etc.)
[profile.release.build-override]
opt-level = 3

# For even better vectorization, build with:
# RUSTFLAGS="-C target-cpu=native" cargo build --release

# Debug profile: release without LTO (for debugging crashes)
# Build with: maturin develop --profile release-debug
[profile.release-debug]
inherits = "release"
lto = false
debug = true
codegen-units = 16
overflow-checks = true
